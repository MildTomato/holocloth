<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="3000" viewBox="0 0 2000 3000" fill="none" stroke="#1a1a1a" stroke-width="2">
  <!-- 2:3 page, same proportions as the original poster, so the cloth keeps its size -->
  <defs>
    <filter id="soft" x="-200" y="-200" width="2400" height="3400" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="40"/>
      <feColorMatrix type="saturate" values="0.4"/>
    </filter>
  </defs>
  <!-- the original poster's printed gradient, with its linework removed -->
  <image href="data:image/png;base64," x="-120" y="-180" width="2240" height="3360" preserveAspectRatio="none" filter="url(#soft)"/>
  <g transform="translate(53 1207.5)">
    <!-- unit s = 229: circle radius, half the frame height -->
    <g>
      <line x1="276" y1="290" x2="1651" y2="290"/>
      <line x1="734" y1="61" x2="734" y2="519"/>
      <line x1="1192" y1="61" x2="1192" y2="519"/>
    </g>
    <g>
      <circle cx="276" cy="290" r="229"/>
      <circle cx="1650" cy="290" r="229"/>
      <line x1="963" y1="61" x2="963" y2="519"/>
    </g>
    <g>
      <ellipse cx="848.5" cy="290" rx="114.5" ry="229"/>
      <circle cx="1192" cy="290" r="229"/>
    </g>
    <rect x="505" y="61" width="916" height="458"/>
  </g>
  <!-- corner labels and the margin rule between them -->
  <g fill="#1a1a1a" stroke="none" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="300" letter-spacing="0.5">
    <text x="100" y="132">Petabyte</text>
    <text x="100" y="2900">Prototype</text>
  </g>
  <line x1="100" y1="176" x2="100" y2="2826" stroke="#1a1a1a" stroke-width="2"/>
</svg>
